apply plugin: 'com.android.application'

def sourceRoot = rootProject.projectDir.parentFile
def artwork = layout.buildDirectory.dir('generated/gameAssets')
def nativeLibraries = layout.buildDirectory.dir('generated/nativeLibraries')
def prebuilt = providers.gradleProperty('nativeLibDir').map { file(it) }
def androidAbis = ['arm64-v8a', 'armeabi-v7a', 'x86_64']
def stageGameAssets = tasks.register('stageGameAssets', Sync) {
    from(new File(sourceRoot, 'public/assets')) { into 'assets' }
    from(new File(sourceRoot, 'public/data')) {
        include 'game-lexicon.nouns.json', 'nouns.full.json', 'level-pools.json', 'nouns-sources.json', 'migrations/*.json'
        into 'data'
    }
    into(artwork)
}
def rustManifest = new File(sourceRoot, 'rust/app/Cargo.toml')
def buildRustAndroid = tasks.register('buildRustAndroid', Exec) {
    workingDir sourceRoot
    def arguments = ['cargo', 'ndk', '-p', '24', '-o', nativeLibraries.get().asFile.absolutePath]
    androidAbis.each { arguments.addAll(['-t', it]) }
    arguments.addAll(['build', '--release', '--locked', '--manifest-path', rustManifest.absolutePath])
    commandLine arguments
}
def checkNativeLibraries = tasks.register('checkNativeLibraries') {
    if (!prebuilt.isPresent()) dependsOn(buildRustAndroid)
    doLast {
        def libraryDir = prebuilt.isPresent() ? prebuilt.get() : nativeLibraries.get().asFile
        androidAbis.each { abi ->
            if (!new File(libraryDir, "${abi}/libbashkir_words.so").isFile()) {
                throw new GradleException("Missing Rust library for ${abi}")
            }
        }
    }
}

android {
    namespace = 'ru.bashkir.words'
    compileSdk = rootProject.ext.compileSdkVersion
    defaultConfig {
        applicationId 'ru.bashkir.words'
        minSdkVersion rootProject.ext.minSdkVersion
        targetSdkVersion rootProject.ext.targetSdkVersion
        versionCode 32
        versionName '3.0.0'
        ndk { abiFilters.addAll(androidAbis) }
        testInstrumentationRunner 'androidx.test.runner.AndroidJUnitRunner'
    }
    sourceSets {
        main {
            assets.setSrcDirs([artwork])
            jniLibs.setSrcDirs([prebuilt.isPresent() ? prebuilt.get() : nativeLibraries])
        }
    }
    buildTypes {
        release { minifyEnabled false }
    }
    androidResources { noCompress.add('wav') }
}

tasks.named('preBuild').configure { dependsOn(stageGameAssets, checkNativeLibraries) }

dependencies {
    implementation "androidx.appcompat:appcompat:$androidxAppCompatVersion"
    implementation "androidx.core:core-splashscreen:$coreSplashScreenVersion"
    testImplementation "junit:junit:$junitVersion"
    androidTestImplementation "androidx.test.ext:junit:$androidxJunitVersion"
    androidTestImplementation "androidx.test.espresso:espresso-core:$androidxEspressoCoreVersion"
}
