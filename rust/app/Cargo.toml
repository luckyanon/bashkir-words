[package]
name = "bashkir-words"
version = "3.0.0"
edition = "2024"
rust-version = "1.85"
publish = false

[lib]
name = "bashkir_words"
crate-type = ["rlib", "cdylib"]

[dependencies]
bashkir-hardcore = { path = "../hardcore" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
unicode-normalization = "0.1"

[target.'cfg(target_os = "android")'.dependencies]
jni = "0.21"

[profile.release]
lto = "thin"
strip = "debuginfo"
